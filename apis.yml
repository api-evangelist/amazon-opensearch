name: Amazon OpenSearch Service API
description: Amazon OpenSearch Service is a managed service that makes it easy to deploy, operate, and scale OpenSearch clusters in the AWS Cloud.
  It offers visualization capabilities powered by OpenSearch Dashboards and Kibana, and provides direct access to the OpenSearch API so that existing
  code and applications work seamlessly. It supports log analytics, full-text search, application monitoring, and clickstream analytics.
